[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rover-bean-dashboard"
version = "0.1.0"
description = "Localhost supervision dashboard for the Rover Bean robotd bench baseline"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
robot-dashboard = "robot_dashboard.server:main"

[tool.setuptools.packages.find]
where = ["src"]
