[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rover-bean-robotd"
version = "0.1.0"
description = "Observable body daemon for the Rover Bean bench baseline"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
robotd = "robotd.daemon:main"
robotctl = "robotd.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
